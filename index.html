<!DOCTYPE html>
    <head>
        <title>Calculator!</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        
        <div class="Calculator">

            <h1 class="Text">Calculator</h1>
            <h1 id="result" class="result">0</h1>

            <input id="num1" class="input" type="number">
            <br><br>
            <input id="num2" class="input" type="number">
            <br><br><br>

            <div>
                <button id="add-btn" class="btn">+</button>
                <button id="minus-btn" class="btn">-</button>
            </div>

            <br>

            <div>
                <button id="multiply-btn" class="btn">*</button>
                <button id="divide-btn" class="btn">/</button>
            </div>

        <script src="script.js"></script>
        </div>

    </body>
</html>
